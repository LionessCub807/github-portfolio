<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selly Beyene – Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#e9edf4;--ink:#12203a;--mute:#5a6785;--acc:#7c3aed;--acc2:#067a46;--panel:#fff;--line:#d3dae8;--r:8px;--font:"JetBrains Mono",ui-monospace,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--onacc:#fff}
:root[data-theme=dark]{--bg:#0e1424;--ink:#dbe3f5;--mute:#8f9cc2;--acc:#b794ff;--acc2:#4ade80;--panel:#151d33;--line:#263252;--onacc:#0e1424}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--ink:#dbe3f5;--mute:#8f9cc2;--acc:#b794ff;--acc2:#4ade80;--panel:#151d33;--line:#263252;--onacc:#0e1424}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:32px 20px 96px}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:64px;font-size:.9rem}
nav a{text-decoration:none;color:var(--mute)}nav a:hover{color:var(--acc2)}
nav .brand{color:var(--ink);font-weight:700}nav .brand b{color:var(--acc)}
nav .links{display:flex;gap:18px}
.prompt{color:var(--mute);margin:0 0 10px}.prompt b{color:var(--acc2);font-weight:700}
h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.08;margin:0 0 18px;font-weight:700;letter-spacing:-.04em;max-width:18ch}
.caret{display:inline-block;width:.5ch;height:.9em;background:var(--acc2);vertical-align:-.1em;margin-left:.15ch;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lede{color:var(--mute);max-width:56ch;margin:0 0 72px}
h2{font-size:1rem;margin:0 0 20px;color:var(--mute);font-weight:400}h2 b{color:var(--acc2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.panel{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .2s,border-color .2s}
.panel:hover{transform:translateY(-4px);border-color:var(--acc2)}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.75rem;color:var(--mute)}
.bar i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.bar span{margin-left:6px}
.panel .body{padding:16px 18px 20px}
.panel h3{margin:0 0 6px;font-size:1.1rem;line-height:1.3}
.panel h3::before,.detail h1::before{content:"~/";color:var(--acc)}
.panel p{margin:0 0 12px;color:var(--mute);font-size:.88rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;padding:1px 8px;border-radius:3px;border:1px solid var(--line);color:var(--mute)}
.media{aspect-ratio:16/10;width:100%;display:block;object-fit:cover;background:var(--line)}
.ph{display:grid;place-items:center;font-weight:700;font-size:2rem;color:rgba(255,255,255,.88);letter-spacing:-.03em}
.back{display:inline-block;margin-bottom:32px;color:var(--mute);text-decoration:none}
.back:hover{color:var(--acc2)}
.detail{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:start}
.win{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.detail .media{aspect-ratio:4/3}
.detail h1{font-size:clamp(1.7rem,4vw,2.5rem);margin-bottom:14px}
.detail p{margin:0 0 16px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{padding:9px 16px;border-radius:4px;border:1px solid var(--ink);text-decoration:none;font-weight:700;font-size:.88rem}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn:hover{opacity:.85}
.mode{font:inherit;font-size:.85rem;background:none;border:1px solid var(--line);border-radius:4px;color:var(--mute);padding:2px 10px;cursor:pointer}
.mode:hover{color:var(--acc2);border-color:var(--acc2)}
@media(max-width:760px){.grid,.detail{grid-template-columns:1fr}.detail{gap:24px}}
@media(prefers-reduced-motion:reduce){.panel{transition:none}.panel:hover{transform:none}.caret{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ---- EDIT ME ----
   media.src: path to your image or video (e.g. "images/shelf.png" or "videos/demo.mp4").
   Leave src empty to show a colored placeholder. */
const ME = {
  name: "Selly Beyene",
  bio: "Hi everyone! I’m Selly and I’m an aspiring full-stack developer focused on AI and ML implementations and producing well thought out and creative projects. I love working with cutting edge technology and learning new things.",
  github: "https://github.com/LionessCub807",
  email: "sellybeyene@outlook.com"
};
const PROJECTS = [
  {slug:"ai-video-workshop", title:"AI Video Workshop", blurb:"A tool designed to help video editors streamline the process of editing long-form videos.", hue:258, media:{type:"image", src:"ai_workshop_view.png"},
   tags:["Python","FastAPI","AI Pipeline","React"], repo:"https://github.com/LionessCub807/ai-video-workshop", demo:"#",
   desc:["Editing long videos can require hours of manually reviewing footage to find moments that could benefit from sound effects, cuts, emphasis, or other enhancements.", "Video Editor Enhancer aims to simplify this process by:", 
    "- Identifying key moments in a video",
    "- Providing precise timestamps",
    "- Suggesting potential edits",
    "- Recommending appropriate sound effects",
    "- Explaining the reasoning behind each suggestion",
    "The goal is not to replace the editor, but to provide useful recommendations that make the editing workflow faster and easier."]},
  {slug:"zero-g-rl-project", title:"Zero Gravity Reinforcement Learning", blurb:"A imperical investigation of RL algorithms in an outer space environment.", hue:150, media:{type:"video", src:"video_tour_of_virtual_iss.mp4"},
   tags:["Python","Reinforcement Learning", "XML"], repo:"https://github.com/LionessCub807/zero-g-rl-project", demo:"",
   desc:["This project compares two reinforcement learning algorithms (Proximal Policy Optimization & Soft Actor-Critic) and how they behave in both a fully observable and a partially observable environment. The agent is cube-shaped robot in a zero-gravity environment aboard a simulated International Space Station.","It's inspired by NASA's Astrobee robots aboard the International Space Station."]},
  {slug:"fitness-trainer-chatbot", title:"Fitness Chatbot", blurb:"A fitness chatbot that gives workout suggestions.", hue:270, media:{type:"image", src:"fitness_chatbot_ui.png"},
   tags:["Python","LangChain","Streamlit", "FastAPI"], repo:"https://github.com/LionessCub807/fitness-trainer-chatbot", demo:"#",
   desc:["This project is a fitness chatbot developed in Python using LangChain. Streamlit for the UI. FastAPI for the API.","Users can interact and create workout plans with the chatbot."]},
];
/* ------------------ */

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function media(p, thumb){
  const m = p.media;
  if(m.src){
    return m.type === "video"
      ? `<video class="media" src="${esc(m.src)}" ${thumb?"muted playsinline preload=metadata":"controls playsinline"}></video>`
      : `<img class="media" src="${esc(m.src)}" alt="${esc(p.title)} screenshot" loading="lazy">`;
  }
  const label = m.type === "video" ? "▶ " + p.title : p.title;
  return `<div class="media ph" role="img" aria-label="Placeholder for ${esc(p.title)} ${m.type}" style="background:linear-gradient(135deg,hsl(${p.hue} 65% 45%),hsl(${(p.hue+25)%360} 70% 30%))">${esc(label)}</div>`;
}
const tags = p => `<div class="tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`;

function nav(){
  return `<nav><a class="brand" href="#/"><b>~/</b>${esc(ME.name.toLowerCase().replace(/ /g,"-"))}</a>
  <div class="links"><a href="${esc(ME.github)}">GitHub</a><a href="${esc(ME.email)}">Email</a><button class="mode" type="button"></button></div></nav>`;
}
function home(){
  app.innerHTML = nav() +
  `<p class="prompt"><b>$</b> whoami</p><h1>${esc(ME.name)}, building innovative AI/ML projects.<span class="caret"></span></h1><p class="lede">${esc(ME.bio)}</p>
  <h2><b>#</b> projects</h2><div class="grid">` +
  PROJECTS.map(p=>`<a class="panel" href="#/p/${p.slug}"><div class="bar"><i></i><i></i><i></i><span>${esc(p.slug)}/</span></div>${media(p,true)}<div class="body"><h3>${esc(p.title)}</h3><p>${esc(p.blurb)}</p>${tags(p)}</div></a>`).join("") +
  `</div>`;
  document.title = ME.name + " – Portfolio";
}
function project(slug){
  const p = PROJECTS.find(x=>x.slug===slug);
  if(!p){ location.hash = "#/"; return; }
  app.innerHTML = nav() + `<a class="back" href="#/">$ cd ..</a>
  <div class="detail"><div class="win"><div class="bar"><i></i><i></i><i></i><span>${esc(p.slug)}/</span></div>${media(p,false)}</div>
  <div><h1>${esc(p.title)}</h1>${tags(p)}<div style="height:18px"></div>
  ${p.desc.map(d=>`<p>${esc(d)}</p>`).join("")}
  <div class="btns"><a class="btn pri" href="${esc(p.repo)}">View on GitHub</a>${p.demo?`<a class="btn" href="${esc(p.demo)}">Live demo</a>`:""}</div></div></div>`;
  document.title = p.title + " – " + ME.name;
}
function route(){
  const m = location.hash.match(/^#\/p\/(.+)$/);
  m ? project(decodeURIComponent(m[1])) : home();
  window.scrollTo(0,0);
}
addEventListener("hashchange", route);

/* Light/dark mode: follows the system setting until the visitor picks one */
const mq = matchMedia("(prefers-color-scheme: dark)");
const root = document.documentElement;
let saved = null;
try{ saved = localStorage.getItem("theme"); }catch(e){}
if(saved==="light"||saved==="dark") root.dataset.theme = saved;
const isDark = () => root.dataset.theme ? root.dataset.theme==="dark" : mq.matches;
function syncMode(){
  document.querySelectorAll(".mode").forEach(b=>{
    b.textContent = isDark() ? "light" : "dark";
    b.setAttribute("aria-label", isDark() ? "Switch to light mode" : "Switch to dark mode");
  });
}
document.addEventListener("click", e=>{
  if(!e.target.closest(".mode")) return;
  const next = isDark() ? "light" : "dark";
  root.dataset.theme = next;
  try{ localStorage.setItem("theme", next); }catch(err){}
  syncMode();
});
mq.addEventListener("change", syncMode);
new MutationObserver(syncMode).observe(app,{childList:true});
route();

</script>
</body>
</html>
